    <body>
        <!-- <header class="page-wrapper"> -->
        <header class="full-header">
            <div class="page-wrapper">
                <div class="logo">

                <nav>
                    <!-- Hamburger icon voor mobiel -->
                    <div class="menu-toggle" id="mobile-menu">
                        <i class="fas fa-bars"></i>
                    </div>

                    <ul class="nav-links">
                        <li><a href="./">Home</a></li>
                        <li><a href="#intro">Over</a></li>
                        <li><a href="#expertise">Expertises</a></li>
                        <li><a href="#education">Docent/spreker</a></li>
                        <li><a href="#collaborations">Samenwerkingen</a></li>
                        <li><a href="#contact">Contact</a></li>
                    </ul>
                </nav>
            </div>
        </header>
        <main id="main-content"></main>
        <footer>
            <div class="footer-top">
                <nav>
                    <button class="footer-button" id="openPrivacy"><i class="fa-solid fa-shield-halved"></i> Privacyverklaring</button>
                    <button class="footer-button" id="openDisclaimer"><i class="fa-solid fa-circle-info"></i> Disclaimer</button>
                    <button class="footer-button" id="openColofon"><i class="fa-solid fa-user"></i> Colofon</button>
                </nav>
                <div class="">
                    <img src="./images/logo_jeroen.png" alt="Logo Jeroen">
                    <img src="./images/logo_ivrt_invers_en.png" alt="Logo IVRT">
                </div>
            </div>
            <div class="footer-bottom">
                &copy; <span id="year"></span> FysioLin. Alle rechten voorbehouden.
                <script>
                // Huidige jaar ophalen
                const year = new Date().getFullYear();

                // Jaar invoegen in het element met id "year"
                document.getElementById("year").textContent = year;
                </script>
            </div>
            <div class="page-wrapper">
                <button onclick="topFunction()" id="topButton" title="Go to top"><i class="fa-solid fa-arrow-up"></i></button>
            </div>
    
            <!-- <div class="modal-content" id="disclaimerContent"></div> -->
    
            <!-- Containers waar modals via fetch wordt geladen -->
            <div id="modalContainer"></div>
            <div id="modalDisclaimerContainer"></div>
            <div id="modalColofonContainer"></div>
            </footer>


        <script>

        // mobiel menu werking
        const mobileMenu = document.getElementById('mobile-menu');
        const navLinks = document.querySelector('.nav-links');
        const navItems = document.querySelectorAll('.nav-links li a');

        mobileMenu.addEventListener('click', () => {
        navLinks.classList.toggle('active');
        });
        
        // Sluit menu bij klik op een link
        navItems.forEach(item => {
        item.addEventListener('click', () => {
            navLinks.classList.remove('active');
        });
        });

        // topButton werking

        // Get the button:
        let topbutton = document.getElementById("topButton");

        // When the user scrolls down 20px from the top of the document, show the button
        window.onscroll = function() {scrollFunction()};

        function scrollFunction() {
        if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
            topbutton.style.display = "block";
        } else {
            topbutton.style.display = "none";
        }
        }

        // When the user clicks on the button, scroll to the top of the document
        function topFunction_old() {
        document.body.scrollTop = 0; // For Safari
        document.documentElement.scrollTop = 0; // For Chrome, Firefox, IE and Opera
        }

        // Deze topFunction verwijdert #id uit adresbalk, is SEO-vriendelijk
        function topFunction() {
            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });

            // Alleen verwijderen als we echt boven zijn
            setTimeout(() => {
                history.replaceState(null, null, window.location.pathname);
            }, 400);
        }

        </script>

        <script type="module" src="./main.js"></script>
        <!-- <script src="./main.js"></script> -->
