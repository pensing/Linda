<link rel="stylesheet" href="reset.css">
<link rel="stylesheet" href="./main.css">
<link rel="stylesheet" href="./base.css">
<link rel="preconnect" href="https://kit.fontawesome.com" crossorigin>
<script src="https://kit.fontawesome.com/20d281916e.js"
    crossorigin="anonymous" defer></script>
<script src="formcheck.js" defer></script>

<style>

    #contact .blue {
        position: relative;
        width: 50%;
        height: 200px;
        background-color: var(--color-accent1);
        right: 0;
        z-index: -1;
        margin-right: 0;
        margin-left: auto;
    }

    #contact .beige {
        height: 200px;
        width: 50%;
        background-color: var(--color-accent2);
        position: relative;
        left: 0;
        z-index: -1;
        margin-right: auto;
        margin-left: 0;
    }

    #contact {
        padding: 4rem 0;
    }
    
    form{
        width: clamp(10rem, 60%, 40rem);
        gap: 1rem;
        display: grid;
        grid-template-areas:
            "title      title   "
            "email      name    "
            "phone      phone   "
            "message    message "
            "tos        tos     "
            "submit     submit  ";
    }

    .container{
        display: flex;
        flex-direction: column;
    }

    .contact-title {
        grid-area: title;
        text-align: center;
    }

    .email {
        grid-area: email;
    }

    .name {
        grid-area: name;
    }

    .phone {
        grid-area: phone;
    }

    .message {
        grid-area: message;
    }

    .tos{
        grid-area: tos;
    }

    .submit {
        grid-area: submit;
    }

    input,
    textarea{
        padding: 0.5rem;
        border: none;
        border-bottom: 2px black solid;
        outline: none;
    }

    .phone-numbers{
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        width: 20rem;
        gap: 1rem;
    }

    .phone-circle{
        background-color: var(--color-accent1);
        font-size: 4.125rem;
        padding: 1.5rem;
        border-radius: 100%;
        aspect-ratio: 1;
        text-align: center;
        margin-bottom: 1rem;
    }

    .fa-solid {
        color: var(--color-white);
    }

    .number-phone{
        font-weight: 900;
        font-size: 2rem;
    }


    .contact-body {
      width: fit-content;
      padding: 80px;
      margin: -100px auto;
      background-color: #ede8ea !important;
      z-index: 999;
    }

    .contact-name {
      font-size: 40px;
      font-weight: 600;
      line-height: 1;
      margin-bottom: 50px;
    }

    .contact-meta {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex-wrap: wrap;
      cursor: pointer;
    }

    a[href] {
    cursor: pointer;
    }

    a[href^="tel"] {
    cursor: pointer;
    }

    a[href^="mailto"] {
    cursor: pointer;
    }

    .meta-item {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      padding: 6px 8px;
      border-radius: 999px;
      color: var(--muted);
      font-size: 21px;
      transition: background var(--transition), color var(--transition);
      text-decoration: none;
    }

    .meta-item:focus,
    .meta-item:hover{
      color: var(--color-accent1);
      outline: none;
    }

    .meta-item i {
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      font-size: 24px;
      background-color: var(--color-accent1);
      color: #ede8ea !important;
      border-radius: 999px;
      padding: 10px;
    }

    /* Visually hidden helper for accessibility */
    .sr-only {
      position: absolute !important;
      height: 1px; width: 1px;
      overflow: hidden;
      clip: rect(1px, 1px, 1px, 1px);
      white-space: nowrap;
    }


    @media only screen and (min-width: 768px) and (max-width: 1199px) {
        #contact div {
            gap: 2rem;
        }

        .contact-body {
            font-size: 18px;
        }

        .contact-body .meta-item{
            font-size: 18px;
        }
    }

    @media only screen and (max-width: 767px) {
        #contact{
            flex-direction: column;
            align-items: center;
        }

        form {
            width: 100%;
            display: flex;
            flex-direction: column;
        }
    }

    @media only screen and (max-width: 575px) {

        .contact-body {
            padding: 20px;
        }

        #contact{
            gap: 4rem;
        }

    }

    @media only screen and (max-width: 419px) {

        .contact-body {
            margin: unset;
        }

        #contact .blue, #contact .beige {
            display: none;
        }

    }


</style>

<section id="contact" class="page-wrapper">

    <h2 class="contact-title">Wil je met me in contact komen?</h2>
    <!-- <div> -->
        <!-- contactgegevens -->
        <div class="blue"></div>
    
        <div class="contact-body">
            <h2 id="name-1" class="contact-name">Linda Hudepohl</h2>

            <div class="contact-meta">
            <!-- Mobiel -->
            <a class="meta-item" href="tel:+31622741877" aria-label="Bel Linda Hudepohl mobiel">
                <i class="fa-solid fa-mobile-screen-button"></i>
                <span>+31 6 22741877</span>
            </a>

            <!-- Email -->
            <a class="meta-item" href="mailto:linda@fysio-lin.nl" aria-label="Email naar Linda Hudepohl">
                <i class="fa-regular fa-envelope"></i>
                <span>linda@fysio-lin.nl</span>
            </a>

            <!-- LinkedIn -->
            <a class="meta-item" href="https://www.linkedin.com/in/linda-hudepohl-839235153" target="_blank" rel="noopener noreferrer" aria-label="Open LinkedIn profiel van Linda Hudepohl (nieuw tabblad)">
                <i class="fa-brands fa-linkedin-in"></i>
                <span>linda-hudepohl</span>
            </a>
            </div>
        </div>

        <div class="beige"></div>

    <!-- </div> -->

</section>
